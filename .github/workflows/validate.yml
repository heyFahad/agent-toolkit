name: Validate plugins

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Claude Code and Codex CLIs
        # Standalone installers, not a package manager: nothing else in this
        # repo needs Node.js, and this matches how these CLIs actually get
        # installed day to day. Both target $HOME/.local/bin by default
        # (confirmed from each installer's own source), which isn't on PATH
        # for a non-interactive shell like this one, so it's added explicitly
        # for the rest of the job's steps.
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          curl -fsSL https://chatgpt.com/codex/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate Claude Code marketplace manifest
        run: claude plugin validate .claude-plugin/marketplace.json --strict

      - name: Test safety of Codex package sync
        run: python3 scripts/tests/test_sync_codex_packages.py

      - name: Check Codex package files
        run: python3 scripts/sync-codex-packages.py --check

      - name: Install Codex plugins and verify skill and hook discovery
        timeout-minutes: 3
        run: python3 scripts/check-codex-plugins.py

      - name: Validate each plugin
        # Not --strict here: every plugin with a shared skill triggers an
        # expected, benign "symlinks were not read" warning (this repo's
        # skills/ directory is the real content; plugins/*/skills/* are
        # symlinks back to it on purpose - see README). --strict would turn
        # that into a permanent false-positive failure. Real errors (a
        # broken manifest) still fail the plain (non-strict) check below;
        # the canonical content itself is checked --strict next.
        run: |
          for plugin_dir in plugins/*/; do
            echo "::group::$(basename "$plugin_dir")"
            claude plugin validate "$plugin_dir"
            echo "::endgroup::"
          done

      - name: Validate canonical skills directory
        run: claude plugin validate skills --strict

      - name: Check every hook script is executable and syntactically valid
        run: |
          status=0
          while IFS= read -r script; do
            if [ ! -x "$script" ]; then
              echo "::error file=$script::not executable"
              status=1
            fi
            if ! bash -n "$script"; then
              echo "::error file=$script::bash syntax error"
              status=1
            fi
          done < <(find plugins skills -name '*.sh')
          exit $status

      - name: Run hook and skill script tests
        run: |
          status=0
          while IFS= read -r t; do
            echo "::group::$t"
            bash "$t" || status=1
            echo "::endgroup::"
          done < <(find plugins skills -name '*.test.sh')
          exit $status

      - name: Check hooks.json "if" patterns use valid wildcard syntax
        # claude plugin validate never looks at hooks.json at all (it only
        # checks the plugin manifest, skills, agents, and commands), so a
        # broken hook condition ships silently otherwise. Claude Code only
        # expands "*" as a prefix wildcard when it directly follows ":" or
        # " " (e.g. "Bash(git commit:*)"); anywhere else - "Bash(git
        # commit*)" - the "*" is matched as a literal character, so the
        # pattern can never match a real command and the hook's "if"
        # silently never lets it run.
        run: |
          status=0
          while IFS= read -r hooks_file; do
            while IFS= read -r pattern; do
              [ -z "$pattern" ] && continue
              # Strip every valid wildcard (":*" or " *"); any "*" left over
              # was glued directly onto other text and is matched literally.
              cleaned=$(printf '%s' "$pattern" | sed -E 's/([: ])\*/\1STAR_OK/g')
              if printf '%s' "$cleaned" | grep -q '\*'; then
                echo "::error file=$hooks_file::hook \"if\" pattern '$pattern' has a '*' not directly preceded by ':' or ' ' - it will be matched literally and this hook's if condition will never match a real command"
                status=1
              fi
            done < <(jq -r '.hooks[]? | .[]? | .hooks[]? | .if // empty' "$hooks_file")
          done < <(find plugins -name 'hooks.json')
          exit $status
